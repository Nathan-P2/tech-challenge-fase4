[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hospital-monitor"
version = "0.1.0"
description = "Monitoramento multimodal de pacientes (vídeo, áudio, sinais vitais) com detecção de anomalias e Azure AI"
requires-python = ">=3.11,<3.14"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.1",
    "scipy>=1.11",
    "scikit-learn>=1.4",
    "matplotlib>=3.8",
    "opencv-python-headless>=4.9",
    "librosa>=0.10",
    "soundfile>=0.12",
    "ultralytics>=8.1",
    "azure-cognitiveservices-speech>=1.35",
    "azure-ai-textanalytics>=5.3",
]

[project.optional-dependencies]
whisper = ["faster-whisper>=1.0"]
dashboard = ["streamlit>=1.32"]
physionet = ["wfdb>=4.1"]
dev = ["pytest>=8"]

[project.scripts]
hospital-monitor = "hospital_monitor.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
filterwarnings = ["ignore::DeprecationWarning", "ignore::UserWarning", "ignore::FutureWarning"]
